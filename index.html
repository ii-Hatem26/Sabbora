<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبورة مهام الطالب الجامعي</title>
  <!-- خط تجوال العربي -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* الوضع الفاتح (السبورة البيضاء) */
      --bg-body: #e5e7eb;
      --bg-header: #ffffff;
      --bg-board: #f4f5f7;
      --board-dots: #cbd5e1;
      --board-border: #cbd5e1;
      --text-main: #1f2937;
      --text-muted: #64748b;
      --tip-bg: #eff6ff;
      --tip-border: #bfdbfe;
      --tip-text: #1e40af;
      
      --pin-red: #ef4444;
      --pin-blue: #3b82f6;
      --pin-green: #10b981;

      /* ألوان أوراق المهام */
      --paper-assignment: #fef08a; /* أصفر */
      --paper-exam: #fecaca;       /* أحمر فاتح */
      --paper-task: #e0f2fe;       /* أزرق فاتح */
      --paper-text: #0f172a;
    }

    /* الوضع الداكن (السبورة الخضراء) */
    body.dark-mode {
      --bg-body: #0f172a;
      --bg-header: #1e293b;
      --bg-board: #143d29; /* لون السبورة الخضراء الكلاسيكية */
      --board-dots: rgba(255, 255, 255, 0.15);
      --board-border: #854d0e; /* إطار بني خشبي */
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --tip-bg: #064e3b;
      --tip-border: #047857;
      --tip-text: #a7f3d0;

      --paper-assignment: #fef08a;
      --paper-exam: #fecaca;
      --paper-task: #bae6fd;
      --paper-text: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    /* هيدر التطبيق */
    header {
      width: 100%;
      max-width: 1200px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      background: var(--bg-header);
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .logo-zone h1 {
      font-size: 1.4rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-zone span {
      background: #3b82f6;
      color: white;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
    }

    /* أدوات التحكم والفلترة */
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(148, 163, 184, 0.2);
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .filter-btn.active, .filter-btn:hover {
      background: #2563eb;
      color: #ffffff;
    }

    .theme-toggle {
      background: none;
      border: 1px solid var(--text-muted);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .add-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
    }

    .add-btn:hover {
      background: #1d4ed8;
    }

    /* شريط النصيحة اليومية */
    .tip-banner {
      width: 100%;
      max-width: 1200px;
      background-color: var(--tip-bg);
      border: 1px solid var(--tip-border);
      color: var(--tip-text);
      padding: 12px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .tip-content {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .refresh-tip-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      color: inherit;
      opacity: 0.8;
    }

    .refresh-tip-btn:hover {
      opacity: 1;
    }

    /* إطار السبورة */
    .whiteboard-frame {
      width: 100%;
      max-width: 1200px;
      min-height: 70vh;
      background-color: var(--bg-board);
      background-image: radial-gradient(var(--board-dots) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      border: 12px solid var(--board-border);
      border-radius: 16px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.2), 0 10px 25px rgba(0,0,0,0.15);
      padding: 25px;
      position: relative;
    }

    .whiteboard-frame::after {
      content: '';
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 12px;
      background: #94a3b8;
      border-radius: 4px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
    }

    /* شبكة الأوراق */
    .board-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    /* ورقة المهمة */
    .paper-note {
      position: relative;
      padding: 22px 16px 16px 16px;
      border-radius: 2px 2px 10px 2px;
      box-shadow: 3px 8px 15px rgba(0,0,0,0.18);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 210px;
      word-wrap: break-word;
      color: var(--paper-text);
    }

    .paper-note::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      border-width: 0 0 14px 14px;
      border-style: solid;
      border-color: transparent transparent rgba(0,0,0,0.15) transparent;
    }

    .paper-note:nth-child(3n+1) { transform: rotate(-1.5deg); }
    .paper-note:nth-child(3n+2) { transform: rotate(1.2deg); }
    .paper-note:nth-child(3n+3) { transform: rotate(-0.8deg); }

    .paper-note:hover {
      transform: scale(1.03) rotate(0deg) !important;
      z-index: 10;
      box-shadow: 5px 12px 22px rgba(0,0,0,0.25);
    }

    .paper-note.assignment { background-color: var(--paper-assignment); }
    .paper-note.exam { background-color: var(--paper-exam); }
    .paper-note.task { background-color: var(--paper-task); }

    /* الدبوس */
    .pin {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      box-shadow: 0 3px 5px rgba(0,0,0,0.3);
      z-index: 2;
    }
    .pin::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
    }
    .paper-note.assignment .pin { background-color: var(--pin-blue); }
    .paper-note.exam .pin { background-color: var(--pin-red); }
    .paper-note.task .pin { background-color: var(--pin-green); }

    /* محتوى المهمة */
    .note-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
      border-bottom: 1px dashed rgba(0,0,0,0.15);
      padding-bottom: 6px;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0,0,0,0.08);
    }

    .course-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #334155;
    }

    .note-title {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .note-desc {
      font-size: 0.88rem;
      margin-bottom: 15px;
      flex-grow: 1;
      line-height: 1.4;
      color: #1e293b;
    }

    .note-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(0,0,0,0.15);
      font-size: 0.8rem;
    }

    .due-date {
      font-weight: 700;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      opacity: 0.7;
    }

    .action-btn:hover {
      opacity: 1;
    }

    /* حالة الإنجاز */
    .paper-note.completed {
      opacity: 0.6;
      filter: grayscale(50%);
    }

    .paper-note.completed .note-title {
      text-decoration: line-through;
    }

    .completed-stamp {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-12deg);
      border: 3px solid #16a34a;
      color: #16a34a;
      font-weight: 900;
      font-size: 1.2rem;
      padding: 4px 12px;
      border-radius: 6px;
      display: none;
      pointer-events: none;
    }

    .paper-note.completed .completed-stamp {
      display: block;
    }

    /* النافذة المنبثقة (Modal) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 15px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--bg-header);
      color: var(--text-main);
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
    }

    .modal h2 {
      margin-bottom: 15px;
      font-size: 1.2rem;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--text-muted);
      border-radius: 6px;
      background: var(--bg-body);
      color: var(--text-main);
      outline: none;
      font-size: 0.95rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-cancel {
      background: rgba(148, 163, 184, 0.2);
      color: var(--text-main);
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
    }

    .empty-state div {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    /* Responsive */
    @media (max-width: 640px) {
      header {
        flex-direction: column;
        align-items: stretch;
      }

      .controls {
        justify-content: space-between;
      }

      .filter-btn {
        flex: 1;
        text-align: center;
        padding: 6px 8px;
        font-size: 0.75rem;
      }

      .whiteboard-frame {
        padding: 15px;
        border-width: 8px;
      }

      .board-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- الهيدر والتحكم -->
  <header>
    <div class="logo-zone">
      <h1>📌 سبورة المهام <span>الجامعية</span></h1>
    </div>

    <div class="controls">
      <button class="filter-btn active" onclick="filterNotes('all', event)">الكل</button>
      <button class="filter-btn" onclick="filterNotes('assignment', event)">📝 واجبات</button>
      <button class="filter-btn" onclick="filterNotes('exam', event)">🚨 امتحانات</button>
      <button class="filter-btn" onclick="filterNotes('task', event)">📌 أخرى</button>
      
      <button class="theme-toggle" onclick="toggleDarkMode()" id="themeBtn">
        🌙 الوضع الداكن
      </button>

      <button class="add-btn" onclick="openModal()">
        <span>+</span> إضافة ورقة
      </button>
    </div>
  </header>

  <!-- شريط النصيحة الدراسية -->
  <div class="tip-banner">
    <div class="tip-content">
      <span>💡</span>
      <span id="academicTip">جاري تحميل النصيحة الدراسية...</span>
    </div>
    <button class="refresh-tip-btn" onclick="displayRandomTip()" title="نصيحة أخرى">🔄</button>
  </div>

  <!-- جسم السبورة -->
  <main class="whiteboard-frame">
    <div class="board-grid" id="boardGrid">
      <!-- توليد المهام بواسطة JavaScript -->
    </div>
  </main>

  <!-- نافذة إضافة / تعديل المهمة -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">تعليق ورقة جديدة على السبورة</h2>
      <form id="noteForm" onsubmit="saveNote(event)">
        <div class="form-group">
          <label>عنوان المهمة / الامتحان</label>
          <input type="text" id="noteTitle" placeholder="مثال: تسليم مشروع خوارزميات" required>
        </div>

        <div class="form-group">
          <label>المادة / المساق</label>
          <input type="text" id="courseTitle" placeholder="مثال: أنظمة التحكم الخطية" required>
        </div>

        <div class="form-group">
          <label>نوع الورقة</label>
          <select id="noteType">
            <option value="assignment">📝 واجب دراسي (أصفر)</option>
            <option value="exam">🚨 امتحان / اختبار (أحمر)</option>
            <option value="task">📌 مهمة تنظيمية (أزرق)</option>
          </select>
        </div>

        <div class="form-group">
          <label>تاريخ الاستحقاق / الموعد</label>
          <input type="date" id="dueDate" required>
        </div>

        <div class="form-group">
          <label>ملاحظات إضافية</label>
          <textarea id="noteDesc" rows="3" placeholder="أضف أي تفاصيل سريعة..."></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal()">إلغاء</button>
          <button type="submit" class="add-btn" id="submitBtn">تثبيت بالدبوس 📌</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // النصائح الدراسية
    const academicTips = [
      "تقنية بومودورو: ذاكر لمدة 25 دقيقة ثم خذ استراحة لمدة 5 دقائق لتجديد تركيزك.",
      "شرح المادة لغيرك أو لنفسك بصوت عالٍ هو أفضل طريقة لاختبار فهمك الحقيقي.",
      "لا تراكم الدراسة؛ مراجعة 20 دقيقة يومياً أفضل من 8 ساعات ليلة الامتحان.",
      "اكتب التواريخ المهمة للامتحانات والواجبات فور إعلانها لتقليل التوتر.",
      "تأكد من أخذ قسط كافٍ من النوم قبل الامتحانات، فالنوم يرسخ المعلومات في الذاكرة.",
      "قسم المشاريع الكبيرة إلى مهام صغيرة جداً على السبورة لتسهيل البدء فيها.",
      "قم بحل أسئلة السنوات السابقة؛ فهي تعطيك فكرة دقيقة عن نمط أسئلة الدكتور."
    ];

    // جلب البيانات أو استخدام القائمة الافتراضية
    let notes = JSON.parse(localStorage.getItem('student_whiteboard_notes')) || [
      {
        id: 1,
        title: 'حل واجب التحكم الخطي',
        course: 'أنظمة التحكم',
        type: 'assignment',
        date: '2026-08-20',
        desc: 'كتابة كود MATLAB لتأكيد استجابة النظام من الدرجة الثانية.',
        completed: false
      },
      {
        id: 2,
        title: 'امتحان منتصف الفصل (Midterm)',
        course: 'قواعد البيانات',
        type: 'exam',
        date: '2026-08-26',
        desc: 'مراجعة المخططات ERD وأوامر DDL و PostgreSQL.',
        completed: false
      }
    ];

    let currentFilter = 'all';
    let editingNoteId = null; // متغيرة لمتابعة الورقة الجاري تعديلها

    // إدارة الوضع الداكن
    function initDarkMode() {
      const isDark = localStorage.getItem('student_theme') === 'dark';
      if (isDark) {
        document.body.classList.add('dark-mode');
        document.getElementById('themeBtn').innerHTML = '☀️ الوضع الفاتح';
      }
    }

    function toggleDarkMode() {
      const body = document.body;
      body.classList.toggle('dark-mode');
      const isDark = body.classList.contains('dark-mode');
      localStorage.setItem('student_theme', isDark ? 'dark' : 'light');
      document.getElementById('themeBtn').innerHTML = isDark ? '☀️ الوضع الفاتح' : '🌙 الوضع الداكن';
    }

    // عرض نصيحة عشوائية
    function displayRandomTip() {
      const randomIndex = Math.floor(Math.random() * academicTips.length);
      document.getElementById('academicTip').innerText = academicTips[randomIndex];
    }

    // حفظ في التخزين المحلي
    function saveToLocalStorage() {
      localStorage.setItem('student_whiteboard_notes', JSON.stringify(notes));
    }

    // عرض البطاقات على السبورة
    function renderNotes() {
      const grid = document.getElementById('boardGrid');
      grid.innerHTML = '';

      const filteredNotes = notes.filter(n => currentFilter === 'all' || n.type === currentFilter);

      if (filteredNotes.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div>🧼</div>
            <h3>السبورة نظيفة تماماً!</h3>
            <p>لا توجد مهام حالية تحت هذا التصنيف.</p>
          </div>
        `;
        return;
      }

      filteredNotes.forEach(note => {
        const paper = document.createElement('div');
        paper.className = `paper-note ${note.type} ${note.completed ? 'completed' : ''}`;
        
        paper.innerHTML = `
          <div class="pin"></div>
          <div class="completed-stamp">تم الإنجاز</div>
          
          <div>
            <div class="note-header">
              <span class="course-title">${escapeHtml(note.course)}</span>
              <span class="badge">${getTypeName(note.type)}</span>
            </div>
            <div class="note-title">${escapeHtml(note.title)}</div>
            <div class="note-desc">${escapeHtml(note.desc || 'لا توجد ملاحظات.')}</div>
          </div>

          <div class="note-footer">
            <span class="due-date">📅 ${note.date}</span>
            <div class="actions">
              <button class="action-btn" onclick="toggleComplete(${note.id})" title="تغيير حالة الإنجاز">
                ${note.completed ? '↩️' : '✅'}
              </button>
              <button class="action-btn" onclick="openModal(${note.id})" title="تعديل المهمة">✏️</button>
              <button class="action-btn" onclick="deleteNote(${note.id})" title="حذف الورقة">🗑️</button>
            </div>
          </div>
        `;

        grid.appendChild(paper);
      });
    }

    // حفظ المهمة (سواء كانت جديدة أو تعديل لمهمة موجودة)
    function saveNote(e) {
      e.preventDefault();
      
      const title = document.getElementById('noteTitle').value;
      const course = document.getElementById('courseTitle').value;
      const type = document.getElementById('noteType').value;
      const date = document.getElementById('dueDate').value;
      const desc = document.getElementById('noteDesc').value;

      if (editingNoteId !== null) {
        // حالة التعديل
        notes = notes.map(n => {
          if (n.id === editingNoteId) {
            return { ...n, title, course, type, date, desc };
          }
          return n;
        });
      } else {
        // حالة إضافة جديد
        const newNote = {
          id: Date.now(),
          title,
          course,
          type,
          date,
          desc,
          completed: false
        };
        notes.unshift(newNote);
      }

      saveToLocalStorage();
      renderNotes();
      closeModal();
    }

    function toggleComplete(id) {
      notes = notes.map(n => n.id === id ? { ...n, completed: !n.completed } : n);
      saveToLocalStorage();
      renderNotes();
    }

    function deleteNote(id) {
      if (confirm('هل تريد إزالة هذه الورقة من السبورة؟')) {
        notes = notes.filter(n => n.id !== id);
        saveToLocalStorage();
        renderNotes();
      }
    }

    function filterNotes(filter, event) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderNotes();
    }

    function getTypeName(type) {
      switch (type) {
        case 'assignment': return 'واجب';
        case 'exam': return 'امتحان';
        case 'task': return 'مهمة';
        default: return 'الكل';
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    // فتح النافذة المنبثقة (للإضافة أو للتعديل)
    function openModal(id = null) {
      const modal = document.getElementById('modalOverlay');
      const modalTitle = document.getElementById('modalTitle');
      const submitBtn = document.getElementById('submitBtn');
      const form = document.getElementById('noteForm');

      if (id !== null) {
        // تجهيز النافذة للتعديل
        editingNoteId = id;
        const noteToEdit = notes.find(n => n.id === id);
        
        if (noteToEdit) {
          document.getElementById('noteTitle').value = noteToEdit.title;
          document.getElementById('courseTitle').value = noteToEdit.course;
          document.getElementById('noteType').value = noteToEdit.type;
          document.getElementById('dueDate').value = noteToEdit.date;
          document.getElementById('noteDesc').value = noteToEdit.desc || '';
          
          modalTitle.innerText = 'تعديل ورقة المهمة ✏️';
          submitBtn.innerText = 'حفظ التعديلات 💾';
        }
      } else {
        // تجهيز النافذة للإضافة الجديدة
        editingNoteId = null;
        form.reset();
        modalTitle.innerText = 'تعليق ورقة جديدة على السبورة';
        submitBtn.innerText = 'تثبيت بالدبوس 📌';
      }

      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      document.getElementById('noteForm').reset();
      editingNoteId = null;
    }

    // التشغيل عند الفتح
    initDarkMode();
    displayRandomTip();
    renderNotes();
  </script>
</body>
</html>
